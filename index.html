<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini MU 2D Mobile</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            user-select: none;
        }
        .game-container {
            max-width: 420px;
            margin: 0 auto;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 8px;
            background: #181818;
        }
        h2 { color: #ffd700; margin: 2px 0; font-size: 18px; text-shadow: 0 0 5px #f00; }
        .hud {
            font-size: 12px;
            background: #222;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-around;
        }
        canvas {
            background: #2d371e; /* Color hierba de Lorencia */
            border: 2px solid #555;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 380px;
            height: auto;
        }
        /* Controles Móviles */
        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 5px;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 3px;
        }
        .btn-pad {
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-pad:active { background: #666; }
        .btn-attack-2d {
            background: #c0392b;
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px #7f8c8d;
        }
        .btn-attack-2d:active { transform: translateY(3px); box-shadow: 0 1px #7f8c8d; }
        .panel-stats {
            background: #222;
            margin-top: 8px;
            padding: 6px;
            border-radius: 5px;
            font-size: 12px;
        }
        .btn-stat {
            background: #d35400;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 3px;
            margin: 2px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h2>⚔️ MINI MU 2D ⚔️</h2>
    
    <div class="hud">
        <span><b>Nv:</b> <span id="lvl">1</span></span>
        <span><b>Zen:</b> <span id="zen" style="color:#ffd700;">0</span></span>
        <span><b>Bless:</b> <span id="bless" style="color:#3498db;">0</span></span>
        <span><b>Arma:</b> +<span id="weapon">0</span></span>
    </div>

    <!-- Pantalla del Juego -->
    <canvas id="gameCanvas" width="360" height="240"></canvas>

    <!-- Controles en Pantalla -->
    <div class="controls-container">
        <div class="d-pad">
            <div></div>
            <div class="btn-pad" onclick="move(0, -10)">▲</div>
            <div></div>
            <div class="btn-pad" onclick="move(-10, 0)">◄</div>
            <div class="btn-pad" style="background:#222;"></div>
            <div class="btn-pad" onclick="move(10, 0)">►</div>
            <div></div>
            <div class="btn-pad" onclick="move(0, 10)">▼</div>
            <div></div>
        </div>
        <button class="btn-attack-2d" onclick="attackMonster()">⚔️<br>ATACAR</button>
    </div>

    <!-- Stats & Forja -->
    <div class="panel-stats">
        <div>Puntos Libres: <b id="pts" style="color:#2ecc71;">0</b></div>
        STR: <b id="str">10</b> <button class="btn-stat" onclick="addStat('str')">+1</button> | 
        AGI: <b id="agi">10</b> <button class="btn-stat" onclick="addStat('agi')">+1</button>
        <div style="margin-top: 5px;">
            <button class="btn-stat" style="background:#27ae60; padding:6px 12px;" onclick="upgradeWeapon()">🔨 Mejorar Arma (1 Bless)</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Datos del Jugador
    let player = {
        x: 170,
        y: 110,
        size: 16,
        speed: 10,
        level: 1,
        exp: 0,
        expNext: 30,
        str: 10,
        agi: 10,
        weapon: 0,
        zen: 0,
        bless: 0,
        points: 0,
        isAttacking: false
    };

    // Monstruos Activos
    let monster = {
        x: 80,
        y: 80,
        size: 18,
        name: "Spider",
        hp: 30,
        maxHp: 30,
        exp: 15,
        zen: 10,
        color: "#8e44ad"
    };

    function drawMap() {
        // Fondo (Hierba de Lorencia)
        ctx.fillStyle = "#2e3b1f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Cuadrícula decorativa estilo piso
        ctx.strokeStyle = "#253018";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 30) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
    }

    function drawPlayer() {
        // Cuerpo del Dark Knight (Azul/Gris)
        ctx.fillStyle = "#2980b9";
        ctx.fillRect(player.x, player.y, player.size, player.size);

        // Casco/Cabeza
        ctx.fillStyle = "#f39c12";
        ctx.fillRect(player.x + 3, player.y - 4, 10, 5);

        // Animación de Ataque (Espada)
        if (player.isAttacking) {
            ctx.fillStyle = "#ecf0f1";
            ctx.fillRect(player.x + player.size, player.y - 5, 12, 4);
        }
    }

    function drawMonster() {
        if (monster.hp > 0) {
            // Cuerpo del Monstruo
            ctx.fillStyle = monster.color;
            ctx.fillRect(monster.x, monster.y, monster.size, monster.size);

            // Barra de HP sobre el monstruo
            ctx.fillStyle = "#c0392b";
            ctx.fillRect(monster.x - 2, monster.y - 8, 22, 4);
            ctx.fillStyle = "#2ecc71";
            let hpWidth = (monster.hp / monster.maxHp) * 22;
            ctx.fillRect(monster.x - 2, monster.y - 8, Math.max(0, hpWidth), 4);
        }
    }

    function move(dx, dy) {
        player.x = Math.max(5, Math.min(canvas.width - player.size - 5, player.x + dx));
        player.y = Math.max(5, Math.min(canvas.height - player.size - 5, player.y + dy));
        render();
    }

    function attackMonster() {
        player.isAttacking = true;
        setTimeout(() => { player.isAttacking = false; render(); }, 150);

        // Distancia entre el jugador y el monstruo
        let dist = Math.hypot((player.x - monster.x), (player.y - monster.y));

        if (dist < 35) { // Rango de ataque
            let dmg = Math.floor(player.str * 1.5) + (player.weapon * 6);
            monster.hp -= dmg;

            if (monster.hp <= 0) {
                // Recompensas
                player.zen += monster.zen;
                player.exp += monster.exp;

                if (Math.random() < 0.20) player.bless += 1; // 20% probabilidad de Bless

                if (player.exp >= player.expNext) {
                    player.level++;
                    player.exp -= player.expNext;
                    player.expNext = Math.floor(player.expNext * 1.4);
                    player.points += 5;
                }

                respawnMonster();
            }
        }
        updateUI();
        render();
    }

    function respawnMonster() {
        // Reaparece en una ubicación aleatoria
        monster.x = Math.floor(Math.random() * (canvas.width - 40)) + 20;
        monster.y = Math.floor(Math.random() * (canvas.height - 40)) + 20;
        monster.hp = 30 + (player.level * 15);
        monster.maxHp = monster.hp;
    }

    function addStat(stat) {
        if (player.points > 0) {
            player[stat]++;
            player.points--;
            updateUI();
        }
    }

    function upgradeWeapon() {
        if (player.bless >= 1) {
            player.bless--;
            player.weapon++;
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById("lvl").innerText = player.level;
        document.getElementById("zen").innerText = player.zen;
        document.getElementById("bless").innerText = player.bless;
        document.getElementById("weapon").innerText = player.weapon;
        document.getElementById("pts").innerText = player.points;
        document.getElementById("str").innerText = player.str;
        document.getElementById("agi").innerText = player.agi;
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawMap();
        drawMonster();
        drawPlayer();
    }

    // Movimiento básico del monstruo (Moverse solo)
    setInterval(() => {
        if (monster.hp > 0) {
            monster.x += (Math.random() - 0.5) * 8;
            monster.y += (Math.random() - 0.5) * 8;
            render();
        }
    }, 800);

    render();
    updateUI();
</script>
</body>
</html>
