<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MU Mobile 2D - Isometric Edition</title>
    <style>
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: #111;
            border: 2px solid #332211;
            box-shadow: 0 0 20px rgba(255, 150, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        .header-bar {
            background: linear-gradient(180deg, #2c1d11, #0f0a06);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #553311;
        }
        .header-title { color: #f39c12; font-weight: bold; font-size: 14px; text-shadow: 0 0 4px #ff0000; }
        .header-stats { font-size: 11px; color: #d1ccc0; }

        canvas {
            background: #12100e;
            display: block;
            width: 100%;
            height: 260px;
        }

        /* HUD Estilo MU (Orbes y Botón de Ataque) */
        .hud-bottom {
            background: linear-gradient(180deg, #181410, #080605);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #442200;
        }
        .orb-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .orb {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #666;
            box-shadow: inset 0 0 10px #000, 0 0 8px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .orb-hp { background: radial-gradient(circle at 30% 30%, #ff4d4d, #800000); }
        .orb-mp { background: radial-gradient(circle at 30% 30%, #4d94ff, #002b80); }

        /* Botón de Ataque Twisting Slash */
        .btn-slash {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, #e67e22, #a04000);
            border: 2px solid #ffd700;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 0 12px rgba(230, 126, 34, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-slash:active { transform: scale(0.92); filter: brightness(1.2); }

        /* Control D-Pad Joystick */
        .joystick-zone {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .joystick-stick {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #d35400, #6e2c00);
            border: 1px solid #ffb900;
            border-radius: 50%;
            position: absolute;
        }

        .panel-menu {
            background: #0f0c0a;
            padding: 8px;
            font-size: 11px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #22150a;
        }
        .btn-stat {
            background: #27ae60;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header-bar">
        <div class="header-title">⚔️ MU ONLINE 2D ⚔️</div>
        <div class="header-stats">
            Nv. <b id="lvl" style="color:#2ecc71">1</b> | 
            Zen: <b id="zen" style="color:#f1c40f">0</b> | 
            Bless: <b id="bless" style="color:#3498db">0</b>
        </div>
    </div>

    <canvas id="gameCanvas" width="380" height="260"></canvas>

    <div class="hud-bottom">
        <!-- Controles Joystick -->
        <div class="joystick-zone" id="joyZone">
            <div class="joystick-stick" id="joyStick"></div>
        </div>

        <!-- Orbes de Vida y Mana -->
        <div class="orb-container">
            <div class="orb orb-hp" title="HP"></div>
            <div class="orb orb-mp" title="MP"></div>
        </div>

        <!-- Botón de Habilidad -->
        <button class="btn-slash" onclick="triggerSkill()">
            <span style="font-size:16px;">🌪️</span>
            <span>SLASH</span>
        </button>
    </div>

    <div class="panel-menu">
        <div>Pts: <b id="pts" style="color:#2ecc71">0</b> | STR: <b id="str">10</b> <button class="btn-stat" onclick="addStat('str')">+1</button></div>
        <button class="btn-stat" style="background:#e67e22" onclick="upgradeWeapon()">🔨 Forjar (+<span id="weapon">0</span>)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Jugador (Dark Knight)
    let player = {
        x: 190, y: 130,
        speed: 2.2,
        level: 1, exp: 0, expNext: 30,
        str: 10, agi: 10, weapon: 0,
        zen: 0, bless: 0, points: 0,
        isAttacking: false, attackAngle: 0
    };

    // Monstruo
    let monster = {
        x: 100, y: 80,
        hp: 35, maxHp: 35,
        type: "Spider",
        color: "#8e44ad"
    };

    // Joystick Virtual
    let joy = { active: false, dx: 0, dy: 0 };
    const joyZone = document.getElementById("joyZone");
    const joyStick = document.getElementById("joyStick");

    joyZone.addEventListener("touchstart", handleJoyStart);
    joyZone.addEventListener("touchmove", handleJoyMove);
    joyZone.addEventListener("touchend", handleJoyEnd);

    function handleJoyStart(e) { joy.active = true; handleJoyMove(e); }
    function handleJoyMove(e) {
        if (!joy.active) return;
        let rect = joyZone.getBoundingClientRect();
        let touch = e.touches[0];
        let x = touch.clientX - (rect.left + rect.width / 2);
        let y = touch.clientY - (rect.top + rect.height / 2);
        let dist = Math.hypot(x, y);
        let maxDist = 30;

        if (dist > maxDist) { x = (x / dist) * maxDist; y = (y / dist) * maxDist; }
        joyStick.style.transform = `translate(${x}px, ${y}px)`;
        joy.dx = x / maxDist;
        joy.dy = y / maxDist;
    }
    function handleJoyEnd() {
        joy.active = false;
        joy.dx = 0; joy.dy = 0;
        joyStick.style.transform = `translate(0px, 0px)`;
    }

    // Dibujar Suelo Isométrico (Baldosas de Lorencia)
    function drawIsometricGrid() {
        ctx.fillStyle = "#161311";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#241e1a";
        ctx.lineWidth = 1;
        for (let x = -200; x < canvas.width + 200; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + canvas.height, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x - canvas.height, canvas.height);
            ctx.stroke();
        }
    }

    // Dibujar Dark Knight (Caballero con Armadura)
    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);

        // Sombra en el suelo
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.beginPath();
        ctx.ellipse(0, 12, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cuerpo/Armadura (Plate Armor)
        ctx.fillStyle = "#34495e"; // Pecho metálico
        ctx.fillRect(-8, -12, 16, 18);

        // Hombreras Doradas / Capa Roja
        ctx.fillStyle = "#c0392b"; // Capa
        ctx.fillRect(-10, -10, 4, 16);
        ctx.fillStyle = "#f39c12"; // Hombrera
        ctx.fillRect(-11, -14, 6, 6);
        ctx.fillRect(5, -14, 6, 6);

        // Casco con brillo
        ctx.fillStyle = "#7f8c8d";
        ctx.fillRect(-5, -22, 10, 10);
        ctx.fillStyle = "#e74c3c"; // Pluma del casco
        ctx.fillRect(-2, -26, 4, 5);

        // Espada
        ctx.fillStyle = "#ecf0f1";
        ctx.fillRect(8, -18, 3, 20);
        ctx.fillStyle = "#f1c40f"; // Empuñadura
        ctx.fillRect(6, -4, 7, 3);

        // Animación Twisting Slash
        if (player.isAttacking) {
            ctx.strokeStyle = "rgba(241, 196, 15, 0.8)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, -5, 28, player.attackAngle, player.attackAngle + Math.PI);
            ctx.stroke();
        }

        ctx.restore();
    }

    // Dibujar Monstruo (Spider)
    function drawMonster() {
        if (monster.hp <= 0) return;

        ctx.save();
        ctx.translate(monster.x, monster.y);

        // Sombra
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath();
        ctx.ellipse(0, 8, 10, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cuerpo Araña
        ctx.fillStyle = monster.color;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();

        // Ojos Rojos
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(-4, -4, 3, 3);
        ctx.fillRect(1, -4, 3, 3);

        // Barra de Vida
        ctx.fillStyle = "#333";
        ctx.fillRect(-12, -18, 24, 4);
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(-12, -18, (monster.hp / monster.maxHp) * 24, 4);

        ctx.restore();
    }

    function triggerSkill() {
        player.isAttacking = true;
        player.attackAngle = 0;

        let interval = setInterval(() => {
            player.attackAngle += 0.5;
            if (player.attackAngle > Math.PI * 4) {
                clearInterval(interval);
                player.isAttacking = false;
            }
        }, 30);

        // Daño a monstruos cercanos
        let dist = Math.hypot(player.x - monster.x, player.y - monster.y);
        if (dist < 50 && monster.hp > 0) {
            let damage = Math.floor(player.str * 1.8) + (player.weapon * 8);
            monster.hp -= damage;

            if (monster.hp <= 0) {
                player.zen += 15;
                player.exp += 20;
                if (Math.random() < 0.25) player.bless += 1;

                if (player.exp >= player.expNext) {
                    player.level++;
                    player.exp -= player.expNext;
                    player.expNext = Math.floor(player.expNext * 1.4);
                    player.points += 5;
                }

                setTimeout(respawnMonster, 1000);
            }
            updateUI();
        }
    }

    function respawnMonster() {
        monster.x = Math.floor(Math.random() * 260) + 60;
        monster.y = Math.floor(Math.random() * 160) + 40;
        monster.hp = 35 + (player.level * 10);
        monster.maxHp = monster.hp;
    }

    function addStat(stat) {
        if (player.points > 0) {
            player[stat]++;
            player.points--;
            updateUI();
        }
    }

    function upgradeWeapon() {
        if (player.bless >= 1) {
            player.bless--;
            player.weapon++;
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById("lvl").innerText = player.level;
        document.getElementById("zen").innerText = player.zen;
        document.getElementById("bless").innerText = player.bless;
        document.getElementById("pts").innerText = player.points;
        document.getElementById("str").innerText = player.str;
        document.getElementById("weapon").innerText = player.weapon;
    }

    // Bucle Principal del Juego (60 FPS)
    function gameLoop() {
        // Movimiento con Joystick
        if (joy.active) {
            player.x += joy.dx * player.speed;
            player.y += joy.dy * player.speed;

            // Limitar dentro del mapa
            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(20, Math.min(canvas.height - 20, player.y));
        }

        drawIsometricGrid();
        drawMonster();
        drawPlayer();

        requestAnimationFrame(gameLoop);
    }

    updateUI();
    gameLoop();
</script>
</body>
</html>
