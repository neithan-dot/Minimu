<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MU Online 99B - Mobile Edition</title>
    <style>
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body {
            background-color: #030303;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .mu-game-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: #0a0806;
            border: 3px solid #3d2813;
            box-shadow: 0 0 25px rgba(255, 180, 50, 0.4);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Barra Superior / Selector de Mapas */
        .top-bar {
            background: linear-gradient(180deg, #1f140c, #0d0805);
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #553b1e;
            font-size: 11px;
        }
        .map-selector select {
            background: #1a120b;
            color: #f39c12;
            border: 1px solid #7d572c;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Lienzo del Juego (Mapas 2.5D) */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 270px;
            background: #111;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Estilo 99B Inferior (Orbes y Menú) */
        .mu-hud {
            background: linear-gradient(180deg, #14100c, #050403);
            border-top: 3px solid #3d2813;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Orbes de Vida y Maná */
        .orb-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mu-orb {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #7d572c;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.5);
            background: #110;
        }
        .orb-fill-hp {
            position: absolute;
            bottom: 0; width: 100%;
            background: linear-gradient(0deg, #cc0000, #ff3333);
            transition: height 0.2s;
        }
        .orb-fill-mp {
            position: absolute;
            bottom: 0; width: 100%;
            background: linear-gradient(0deg, #0044cc, #3388ff);
            transition: height 0.2s;
        }
        .orb-text {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: bold; text-shadow: 1px 1px #000;
        }

        /* Botones de Acción / Habilidades */
        .action-cluster {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .mu-btn {
            background: linear-gradient(180deg, #5e4122, #291c0f);
            border: 2px solid #a3753c;
            color: #ffd700;
            font-weight: bold;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            text-shadow: 1px 1px #000;
            box-shadow: 0 3px #110a04;
        }
        .mu-btn:active { transform: translateY(2px); box-shadow: 0 1px #110a04; }
        .btn-skill {
            background: linear-gradient(180deg, #c0392b, #641e16);
            border-color: #e74c3c;
            color: #fff;
            width: 50px; height: 50px;
            border-radius: 50%;
            font-size: 10px;
        }

        /* Joystick Táctil Movimiento */
        .joystick-base {
            width: 75px; height: 75px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(243, 156, 18, 0.3);
            border-radius: 50%;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .joystick-knob {
            width: 32px; height: 32px;
            background: radial-gradient(circle, #f39c12, #935116);
            border: 1px solid #ffd700;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 6px #000;
        }

        /* Ventana Flotante de Inventario / Stats */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .mu-window {
            background: linear-gradient(135deg, #1b130e, #0c0806);
            border: 3px solid #7d572c;
            border-radius: 8px;
            width: 90%;
            max-width: 360px;
            padding: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        .window-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #553b1e;
            padding-bottom: 5px; margin-bottom: 8px;
            color: #f39c12; font-size: 13px; font-weight: bold;
        }
        .close-btn { color: #e74c3c; cursor: pointer; font-size: 16px; font-weight: bold; }
        
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background: #080605;
            padding: 6px;
            border: 1px solid #422d17;
            margin-top: 8px;
        }
        .inv-slot {
            background: #14100c;
            border: 1px solid #332211;
            height: 45px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 9px; color: #d1ccc0;
        }
        .item-icon { font-size: 16px; }

        .stat-row { display: flex; justify-content: space-between; font-size: 12px; margin: 5px 0; }
        .stat-btn { background: #27ae60; border: none; color: white; padding: 2px 8px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>

<div class="mu-game-container">
    <!-- Barra Superior -->
    <div class="top-bar">
        <div><b>MU 99B</b> | Nv: <span id="lvl" style="color:#2ecc71">1</span></div>
        <div class="map-selector">
            Mapa: 
            <select id="mapSelect" onchange="changeMap(this.value)">
                <option value="lorencia">Lorencia</option>
                <option value="noria">Noria</option>
                <option value="devias">Devias (Nieve)</option>
            </select>
        </div>
        <div>Zen: <span id="zen" style="color:#f1c40f">0</span></div>
    </div>

    <!-- Canvas de Juego -->
    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="400" height="270"></canvas>
    </div>

    <!-- HUD Estilo 99B -->
    <div class="mu-hud">
        <!-- Joystick Movimiento -->
        <div class="joystick-base" id="joyBase">
            <div class="joystick-knob" id="joyKnob"></div>
        </div>

        <!-- Orbes HP / MP -->
        <div class="orb-wrapper">
            <div class="mu-orb" title="HP">
                <div class="orb-fill-hp" id="hpFill" style="height: 100%;"></div>
                <div class="orb-text" id="hpText">100/
